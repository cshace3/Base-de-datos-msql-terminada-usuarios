<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/css/styleregistr.css">
</head>

<body>
    <div>
        <center>
            <img src="/img/Logo1.png" width="200" height="200">
        </center>
    </div>


    <div class="contenedor">
        <h1>Registro de usuario</h1>
        <form onsubmit="registrar(event)">
            <input type="text" id="usuario" placeholder="Nombre Completo" required>
            <input type="date" id="fecha" placeholder="Fecha de nacimiento" required>
            <input type="email" id="correo" placeholder="Correo Electrónico" required>
            <input type="password" id="contraseña" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
        <p id="mensaje"></p>
    </div>


    <nav>
        <a href="inicio.html" style="color: rgb(240, 238, 238);">Iniciar Sesion</a>
    </nav>
<script src="/js/script.js"></script>
</body>

</html>
