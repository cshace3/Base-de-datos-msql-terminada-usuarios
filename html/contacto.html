<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Polar'Is</title>
    <link rel="stylesheet" href="../css styles/stylecontacto.css">
    <link rel="stylesheet" href="/css/stylecontacto.css">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-decor">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="main-wrapper">
        <div class="header-bar">
            <div class="brand-logo-wrap">
                <img class="logo" src="../img/Logo1.png" onerror="this.src='/img/Logo1.png'" alt="Logo Polar'Is">
                <span>Polar'Is</span>
            </div>

            <nav>
                <a href="Productos.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Volver a Productos</span>
                </a>
            </nav>
        </div>

        <div class="Leter">
            <h1>CONTÁCTENOS</h1>
            <p>Si deseas alguna información o ayuda, no dudes en escribirnos por nuestras redes sociales.</p>
        </div>

        <div class="contenedor">
            <a href="https://www.instagram.com/" target="_blank" class="contact-item">
                <i class="fa-brands fa-instagram"></i>
                <p>Instagram</p>
            </a>

            <a href="https://twitter.com/" target="_blank" class="contact-item">
                <i class="fa-brands fa-x-twitter"></i>
                <p>X (Twitter)</p>
            </a>

            <a href="https://wa.me/1234567890" target="_blank" class="contact-item">
                <i class="fa-brands fa-whatsapp"></i>
                <p>WhatsApp</p>
            </a>

            <a href="https://www.facebook.com/" target="_blank" class="contact-item">
                <i class="fa-brands fa-facebook"></i>
                <p>Facebook</p>
            </a>
        </div>
    </div>

    <script src="../javascript/script.js"></script>
    <script src="/js/script.js"></script>
</body>

</html>
