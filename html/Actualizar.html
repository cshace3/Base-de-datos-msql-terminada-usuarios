<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar</title>
    <link rel="stylesheet" href="/css/styleactualizar.css">
</head>

<body>
    <div>
        <center>
            <img src="/img/Logo1.png" width="200" height="200">
        </center>
    </div>
    <div class="contenedor">
        <form id="foActualizar">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <input type="email" id="correo" placeholder="Correo" required>
            <input type="password" id="actual" placeholder="Contraseña actual" required>
            <input type="password" id="nueva" placeholder="Nueva contraseña" required>
            <input type="password" id="confirmar" placeholder="Confirmar contraseña" required>

            <button type="submit">Actualizar</button>
            <p id="mensajeactualizar"></p>
        </form>

    </div>


    <script src="/js/script.js"></script>


</body>

</html>
