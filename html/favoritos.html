<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Favoritos | Polar'Is</title>
    <link rel="stylesheet" href="../css styles/stylefavoritos.css">
    <link rel="stylesheet" href="/css/stylefavoritos.css">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-decor">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="main-wrapper">
        <div class="header-bar">
            <div class="brand-logo-wrap">
                <img class="logo" src="../img/Logo1.png" onerror="this.src='/img/Logo1.png'" alt="Logo Polar'Is">
                <span>Polar'Is</span>
            </div>

            <nav>
                <a href="Productos.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Volver a Productos</span>
                </a>
                <a href="perfil.html" title="Mi Perfil">
                    <i class="fa-solid fa-user"></i>
                    <span>Perfil</span>
                </a>
                <a href="carrito.html" title="Ver Carrito">
                    <i class="fa-solid fa-spider" style="color: #e62429;"></i>
                    <span>Carrito</span>
                </a>
            </nav>
        </div>

        <div class="contenedor-favoritos">
            <h1>
                <i class="fa-solid fa-heart"></i>
                <span>Mis Productos Favoritos</span>
            </h1>

            <!-- Contenedor donde se cargarán los productos favoritos dinámicamente -->
            <div id="lista-favoritos"></div>
        </div>
    </div>

    <script src="../javascript/script.js"></script>
    <script src="/js/script.js"></script>
</body>

</html>
