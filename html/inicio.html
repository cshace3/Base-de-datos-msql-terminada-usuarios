<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Polar'Is</title>
    <link rel="stylesheet" href="../css styles/styleinicio.css">
    <link rel="stylesheet" href="/css/styleinicio.css">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-decor">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <main class="container">
        <div class="contenedor">
            <div class="card-header">
                <div class="brand-logo">
                    <img src="../img/Logo1.png" onerror="this.src='/img/Logo1.png'" alt="Logo Polar'Is">
                </div>
                <h1>Inicio de Sesión</h1>
                <p class="subtitle">Ingresa tus credenciales para acceder a tu cuenta</p>
            </div>

            <form onsubmit="iniciar(event)" novalidate>
                <div class="form-group">
                    <label for="usuario">Nombre Completo</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="usuario" placeholder="Ej. Juan Pérez" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="contraseña" placeholder="••••••••" required>
                        <button type="button" class="btn-icon" onclick="togglePasswordVisibility('contraseña', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <span>Iniciar Sesión</span>
                    <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <p id="mensaje"></p>

            <div class="nav-links">
                <a href="Registri.html">¿No tienes cuenta? Registrate aquí</a>
                <a href="Actualizar.html" style="color: #f87171;">¿Olvidaste la contraseña?</a>
            </div>
        </div>
    </main>

    <script src="../javascript/script.js"></script>
    <script src="/js/script.js"></script>
    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }
    </script>
</body>

</html>
