<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="/css/styleinicio.css">
</head>

<body>
    <div>
        <center>
            <img src="/img/Logo1.png" width="200" height="200">
        </center>
    </div>
    <div class="contenedor">
        <h1>Inicio de sesión</h1>
        <form onsubmit="iniciar(event)">
            <input type="text" id="usuario" placeholder="Nombre Completo" required>
            <input type="email" id="correo" placeholder="Correo" required>
            <input type="password" id="contraseña" placeholder="Contraseña" required>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <p id="mensaje"></p>
    </div>

    <nav>
        <a href="Registri.html" style="color: rgb(240, 238, 238);">Registrarse</a>
    </nav>
    <br>
    <div>
        <a href="Actualizar.html" style="color: rgb(182, 30, 30);">¿Olvidó la contraseña?</a>
    </div>
    <script src="/js/script.js"></script>

</body>

</html>
